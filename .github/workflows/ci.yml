name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners are virtual machines without nested virtualization.
  EMU_SKIP_HV_TESTS: "1"

jobs:
  check:
    name: Lint and test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and device tree compiler
        run: |
          rustup show active-toolchain || rustup toolchain install
          brew install dtc
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p vmm

  portable:
    # No hypervisor backend exists for Linux yet. Everything that does not need one (devices,
    # networking, boot image handling) is built and tested there so that it stays portable.
    # Windows is absent on purpose: the virtio-queue crate enables a vm-memory feature that refuses
    # to compile for Windows, so the device crates cannot build there until that is replaced.
    name: Build and test (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources
