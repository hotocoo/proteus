name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners are virtual machines without nested virtualization.
  EMU_SKIP_HV_TESTS: "1"
  # Size budget of the emu executable (blueprint: under 30 MB).
  EMU_MAX_BYTES: "31457280"

jobs:
  check:
    name: Lint and test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and device tree compiler
        run: |
          rustup show active-toolchain || rustup toolchain install
          brew install dtc
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p vmm
      - name: Size budget
        run: |
          size=$(stat -f %z target/release/emu)
          echo "emu is $size bytes (budget $EMU_MAX_BYTES)"
          test "$size" -lt "$EMU_MAX_BYTES"

  portable:
    # No hypervisor backend exists for Linux yet. Everything that does not need one (devices,
    # networking, boot image handling) is built and tested there so that it stays portable.
    # Windows is absent on purpose: the virtio-queue crate enables a vm-memory feature that refuses
    # to compile for Windows, so the device crates cannot build there until that is replaced.
    name: Build and test (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  kvm:
    # Hosted Linux runners expose /dev/kvm to root and the kvm group only; the runner user is let in.
    name: Guests on KVM (Linux x86_64)
    runs-on: ubuntu-24.04
    env:
      EMU_SKIP_HV_TESTS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Open /dev/kvm to this user
        run: sudo chmod 666 /dev/kvm
      - name: Hypervisor tests
        run: cargo test --locked -p hv
      - name: Fetch a test kernel and ramdisk
        # Firecracker's CI images: a BusyBox ramdisk, and a vmlinux from before Firecracker moved to
        # ACPI, so it finds CPUs in the MP table and virtio-mmio devices on its command line, as this
        # board describes them.
        run: |
          base=https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/vmlinux" "$base/v1.7/x86_64/vmlinux-6.1.77"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/initramfs.cpio" "$base/v1.10/x86_64/initramfs.cpio"
      - name: Boot Linux on KVM
        env:
          EMU_TEST_KERNEL: ${{ runner.temp }}/vmlinux
          EMU_TEST_INITRD: ${{ runner.temp }}/initramfs.cpio
        run: cargo test --locked -p vmm --test linux_boot -- --nocapture
      - name: No connections of emu's own (blueprint section 9)
        run: |
          sudo apt-get install -y -qq strace >/dev/null
          cargo build --release --locked -p vmm
          scripts/no-connect.sh target/release/emu 20 \
            --kernel "$RUNNER_TEMP/vmlinux" --initrd "$RUNNER_TEMP/initramfs.cpio" --serial

  policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources
