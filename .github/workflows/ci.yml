name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners are virtual machines without nested virtualization.
  PROTEUS_SKIP_HV_TESTS: "1"
  # Size budget of the proteus executable (blueprint: under 30 MB).
  PROTEUS_MAX_BYTES: "31457280"

jobs:
  check:
    name: Lint and test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and device tree compiler
        run: |
          rustup show active-toolchain || rustup toolchain install
          brew install dtc
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p vmm
      - name: Cached gfxstream
        id: gfxstream
        uses: actions/cache@v4
        with:
          path: gfxstream-out
          key: gfxstream-macos-arm64-${{ hashFiles('scripts/build-gfxstream.sh', 'packaging/gfxstream/**') }}
      - name: Build gfxstream
        if: steps.gfxstream.outputs.cache-hit != 'true'
        run: |
          brew install ninja
          scripts/build-gfxstream.sh "$RUNNER_TEMP/gfxstream" gfxstream-out
      - name: Lint and build with GPU acceleration
        env:
          GFXSTREAM_PATH: ${{ github.workspace }}/gfxstream-out
        run: |
          cargo clippy -p vmm --features gpu --all-targets --locked -- -D warnings
          cargo build --release --locked -p vmm --features gpu
      # The budget counts what a release ships to run: proteus and gfxstream's renderer.
      - name: Size budget
        run: |
          size=$(( $(stat -f %z target/release/proteus) + $(stat -f %z gfxstream-out/libgfxstream_backend.dylib) ))
          echo "proteus and its renderer are $size bytes (budget $PROTEUS_MAX_BYTES)"
          test "$size" -lt "$PROTEUS_MAX_BYTES"

  portable:
    # No hypervisor backend exists for Linux yet. Everything that does not need one (devices,
    # networking, boot image handling) is built and tested there so that it stays portable.
    name: Build and test (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and the sound and device libraries
        run: |
          rustup show active-toolchain || rustup toolchain install
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev >/dev/null
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  kvm:
    # Hosted Linux runners expose /dev/kvm to root and the kvm group only; the runner user is let in.
    name: Guests on KVM (Linux x86_64)
    runs-on: ubuntu-24.04
    env:
      PROTEUS_SKIP_HV_TESTS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and the sound and device libraries
        run: |
          rustup show active-toolchain || rustup toolchain install
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev >/dev/null
      - name: Open /dev/kvm to this user
        run: sudo chmod 666 /dev/kvm
      - name: Hypervisor tests
        run: cargo test --locked -p hv
      - name: Fetch a test kernel and ramdisk
        # Firecracker's CI images: a BusyBox ramdisk, and a vmlinux from before Firecracker moved to
        # ACPI, so it finds CPUs in the MP table and virtio-mmio devices on its command line, as this
        # board describes them.
        run: |
          base=https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/vmlinux" "$base/v1.7/x86_64/vmlinux-6.1.77"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/initramfs.cpio" "$base/v1.10/x86_64/initramfs.cpio"
      - name: Boot Linux on KVM
        env:
          PROTEUS_TEST_KERNEL: ${{ runner.temp }}/vmlinux
          PROTEUS_TEST_INITRD: ${{ runner.temp }}/initramfs.cpio
        run: cargo test --locked -p vmm --test linux_boot -- --nocapture
      - name: No connections of proteus's own (blueprint section 9)
        run: |
          sudo apt-get install -y -qq strace >/dev/null
          cargo build --release --locked -p vmm
          scripts/no-connect.sh target/release/proteus 20 \
            --kernel "$RUNNER_TEMP/vmlinux" --initrd "$RUNNER_TEMP/initramfs.cpio" --serial --headless

  android:
    # Milestone 2's check on Linux: Google's x86_64 Cuttlefish image with this repository's guest
    # kernel boots to sys.boot_completed on KVM, headless, and adb answers without a prompt.
    name: Android on KVM (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and adb
        run: |
          rustup show active-toolchain || rustup toolchain install
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-tools-adb libasound2-dev libudev-dev >/dev/null
      - name: Open /dev/kvm to this user
        run: sudo chmod 666 /dev/kvm
      - name: Build proteus
        run: cargo build --release --locked -p vmm
      - name: Fetch the guest kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow kernel.yml --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          gh run download "$run" -n kernel-x86_64 -D "$RUNNER_TEMP/kernel"
      - name: Fetch the Android image
        # A fixed build, so that a failure here is a change in this repository, not in the image.
        run: scripts/fetch-cuttlefish.sh aosp_cf_x86_64_only_phone-userdebug "$RUNNER_TEMP/image" 16644040
      - name: Boot Android
        run: |
          target/release/proteus --kernel "$RUNNER_TEMP/kernel/kernel-x86_64" \
            --android "$RUNNER_TEMP/image" --data-dir "$RUNNER_TEMP/data" --headless \
            --serial --logcat "$RUNNER_TEMP/logcat.txt" --ctl "$RUNNER_TEMP/proteus.sock" \
            </dev/null >"$RUNNER_TEMP/console.txt" 2>&1 &
          proteus=$!
          deadline=$(( $(date +%s) + 1800 ))
          until [ "$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            if [ "$(date +%s)" -gt "$deadline" ]; then echo "Android did not finish booting"; exit 1; fi
            if ! kill -0 "$proteus" 2>/dev/null; then echo "proteus stopped"; tail -20 "$RUNNER_TEMP/console.txt"; exit 1; fi
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            sleep 10
          done
          echo "booted in $(( $(date +%s) - deadline + 1800 )) s"
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi
          target/release/proteus ctl "$RUNNER_TEMP/proteus.sock" screenshot "$RUNNER_TEMP/screen.png"
          target/release/proteus ctl "$RUNNER_TEMP/proteus.sock" stop
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-kvm
          path: |
            ${{ runner.temp }}/console.txt
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/screen.png
          if-no-files-found: ignore

  policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources

  windows:
    # Hosted runners have no Windows Hypervisor Platform, so guests are not run here.
    name: Lint and test (Windows x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
