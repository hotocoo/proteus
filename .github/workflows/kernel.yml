name: Guest kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - guest/kernel/**
      - .github/workflows/kernel.yml

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://android.googlesource.com/kernel/common
  KERNEL_BRANCH: android16-6.12

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            image: arch/arm64/boot/Image
            target: Image
          - arch: x86_64
            image: vmlinux
            target: vmlinux
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm bc bison flex libssl-dev libelf-dev ccache
      # A full build takes up to an hour; with the compiler cache a rebuild after a small
      # configuration change takes a few minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: kernel-ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: kernel-ccache-${{ matrix.arch }}-
      - name: Fetch kernel source
        run: |
          git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          echo "$KERNEL_REPO $(git -C kernel rev-parse HEAD)" | tee kernel-source.txt
      - name: Configure
        working-directory: kernel
        run: |
          make ARCH=${{ matrix.arch }} LLVM=1 O=out gki_defconfig
          KCONFIG_CONFIG=out/.config scripts/kconfig/merge_config.sh -m out/.config \
            ../guest/kernel/emu.fragment ../guest/kernel/emu-${{ matrix.arch }}.fragment
          make ARCH=${{ matrix.arch }} LLVM=1 O=out olddefconfig
      - name: Check required options
        run: |
          missing=0
          while read -r first second; do
            case "$first" in
              ''|'#'*) continue ;;
              CONFIG_*) option="$first" ;;
              "${{ matrix.arch }}") option="$second" ;;
              *) continue ;;
            esac
            if ! grep -qx "$option=y" kernel/out/.config; then
              echo "::error::$option is not built in"
              missing=1
            fi
          done < guest/kernel/required.config
          exit "$missing"
      - name: Build
        working-directory: kernel
        run: |
          make ARCH=${{ matrix.arch }} LLVM=1 CC="ccache clang" O=out -j"$(nproc)" ${{ matrix.target }}
          ccache --show-stats
      - name: Collect
        run: |
          mkdir dist
          cp "kernel/out/${{ matrix.image }}" "dist/kernel-${{ matrix.arch }}"
          cp kernel/out/.config "dist/kernel-${{ matrix.arch }}.config"
          cp kernel-source.txt "dist/kernel-${{ matrix.arch }}.source.txt"
          if [ "${{ matrix.arch }}" = x86_64 ]; then llvm-strip --strip-debug "dist/kernel-x86_64"; fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
