name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand to build and check the packages without publishing them.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  PROTEUS_SKIP_HV_TESTS: "1"

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-26  # Homebrew's Mesa has KosmicKrisp on macOS 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain and device tree compiler
        run: |
          rustup show active-toolchain || rustup toolchain install
          brew install dtc ninja molten-vk vulkan-loader mesa
      - name: Test
        run: cargo test --workspace --locked
      # gfxstream's renderer takes long to build, so it is kept between runs for its pinned revision.
      - name: Cached gfxstream
        id: gfxstream
        uses: actions/cache@v4
        with:
          path: gfxstream-out
          key: gfxstream-macos-arm64-${{ hashFiles('scripts/build-gfxstream.sh', 'packaging/gfxstream/**') }}
      - name: Build gfxstream
        if: steps.gfxstream.outputs.cache-hit != 'true'
        run: scripts/build-gfxstream.sh "$RUNNER_TEMP/gfxstream" gfxstream-out
      - name: Build with GPU acceleration
        run: GFXSTREAM_PATH="$PWD/gfxstream-out" cargo build --release --locked -p vmm --features gpu
      # The guest kernel is built by its own workflow; the release ships the newest good one, with
      # the configuration and the exact source commit it was built from (it is GPL-2.0).
      - name: Fetch the guest kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow "Guest kernel" --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          test -n "$run"
          gh run download "$run" --name kernel-arm64 --dir kernel
          ls -l kernel
      - name: Package
        run: |
          name="proteus-${GITHUB_REF_NAME}-macos-arm64"
          scripts/fetch-apps.sh apps
          # A loader for macOS 15 and later, so older Macs keep the GPU through MoltenVK.
          export VULKAN_LOADER=$(scripts/build-vulkan-loader.sh "$RUNNER_TEMP/vulkan-loader")
          # KosmicKrisp with this repository's fixes (packaging/mesa), in place of Homebrew's.
          export KOSMICKRISP=$(scripts/build-kosmickrisp.sh "$RUNNER_TEMP/kosmickrisp")
          scripts/bundle-macos.sh target/release/proteus gfxstream-out "$name" apps
          cp README.md packaging/macos/hv.entitlements scripts/install-google.sh "$name/"
          cp kernel/kernel-arm64 kernel/kernel-arm64.config kernel/kernel-arm64.source.txt "$name/"
          cp guest/kernel/README.md "$name/KERNEL.md"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          # The same, as an app that opens the launcher when double-clicked.
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          # The tag, inside the bundle, so the Update button knows what is installed.
          echo "$GITHUB_REF_NAME" > "$name/proteus.release"
          scripts/make-app.sh "$name" "$version" .
          ditto -c -k --keepParent Proteus.app "proteus-${GITHUB_REF_NAME}-macos-arm64-app.zip"
          shasum -a 256 "proteus-${GITHUB_REF_NAME}-macos-arm64-app.zip" > "proteus-${GITHUB_REF_NAME}-macos-arm64-app.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            proteus-*.tar.gz*
            proteus-*-app.zip*

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and the sound and device libraries
        run: |
          rustup show active-toolchain || rustup toolchain install
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev >/dev/null
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p vmm
      - name: Fetch the guest kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow "Guest kernel" --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          test -n "$run"
          gh run download "$run" --name kernel-x86_64 --dir kernel
          ls -l kernel
      - name: Package
        run: |
          name="proteus-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/proteus README.md "$name/"
          # The launcher's Update button compares this with the newest release.
          echo "$GITHUB_REF_NAME" > "$name/proteus.release"
          cp kernel/kernel-x86_64 kernel/kernel-x86_64.config kernel/kernel-x86_64.source.txt "$name/"
          cp guest/kernel/README.md "$name/KERNEL.md"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: proteus-*.tar.gz*

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p vmm
      - name: Fetch the guest kernel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow "Guest kernel" --branch main --status success --limit 1             --json databaseId --jq '.[0].databaseId')
          test -n "$run"
          gh run download "$run" --name kernel-x86_64 --dir kernel
          ls -l kernel
      - name: Package
        shell: pwsh
        run: |
          $name = "proteus-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/proteus.exe, README.md $name
          Copy-Item kernel/kernel-x86_64, kernel/kernel-x86_64.config, kernel/kernel-x86_64.source.txt $name
          Copy-Item guest/kernel/README.md "$name/KERNEL.md"
          # The launcher's Update button compares this with the newest release.
          Set-Content -NoNewline -Encoding ascii "$name/proteus.release" $env:GITHUB_REF_NAME
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: proteus-*-windows-x86_64.zip*

  publish:
    name: Publish
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      # The tag's own message becomes the release notes, so the tag has to be fetched with it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag $prerelease \
            --title "proteus ${GITHUB_REF_NAME#v}" proteus-*.tar.gz proteus-*.tar.gz.sha256 proteus-*-app.zip \
            proteus-*-app.zip.sha256 proteus-*-windows-x86_64.zip proteus-*-windows-x86_64.zip.sha256
