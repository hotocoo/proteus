[workspace]
resolver = "3"
members = ["crates/hv", "crates/arch", "crates/devices", "crates/gfx", "crates/net", "crates/vmm"]

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false

[workspace.dependencies]
hv = { path = "crates/hv" }
arch = { path = "crates/arch" }
devices = { path = "crates/devices" }
gfx = { path = "crates/gfx" }
net = { path = "crates/net" }
cpal = "0.18"
getrandom = "0.3"
gilrs = "0.11"
lexopt = "0.3"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
kvm-ioctls = "0.25"
libc = "0.2"
miniz_oxide = "0.9"
log = "0.4"
rtrb = "0.4"
rutabaga_gfx = { version = "0.1.85", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
virtio-bindings = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
rfd = { version = "0.18", default-features = false }
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "gles", "wgsl"] }
virtio-queue = "0.18"
vm-fdt = "0.3"
vm-memory = { version = "0.18", default-features = false, features = ["backend-mmap"] }
vm-superio = "0.8"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# virtio-queue turns on vm-memory's default `rawfd` feature, which refuses to build for Windows.
# The copy only drops that default; Unix hosts turn `rawfd` back on in crates/devices.
[patch.crates-io]
virtio-queue = { path = "third_party/virtio-queue" }
