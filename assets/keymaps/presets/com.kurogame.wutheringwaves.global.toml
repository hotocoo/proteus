# Wuthering Waves (com.kurogame.wutheringwaves.global), landscape, game's "Static Joystick" mode.
# Keys follow the PC version's defaults. The game ignores a keyboard on Android, so each key taps
# the button that does the same on the touch screen. The mouse turns the camera; Left Alt (Option)
# switches to the pointer and back.
# Menu keys (Esc, M, C, J, B, L, H, N, F2, Enter) also free the pointer; pressing one again, or moving
# (WASD) or acting, gives it back. Keys for menus with no button of their own open the Terminal
# and then tap the menu in it. The Terminal's grid grows as the story unlocks menus, which moves
# its items: these are where they sit once Team is unlocked (Union level 3).
# A gamepad needs no map: the game supports controllers itself.
# Positions measured on a 2400x1080 screen. F taps the first entry of an interaction or dialogue
# list. Not here yet (no touch button found): T, Tab, G, X, V, Ctrl, middle click, O, F1, F3, F4.
size = [2400, 1080]
toggle = "F12"            # whole map off, for typing

[[stick]]                 # movement joystick: centre of its ring
up = "KeyW"
left = "KeyA"
down = "KeyS"
right = "KeyD"
center = [375, 807]
radius = 160

[look]                    # camera: free screen area right of centre
key = "AltLeft"
center = [1500, 450]
radius = 300
sensitivity = 1.0
start = true
hold = false              # Left Alt switches pointer on and off

[zoom]                    # mouse wheel: camera zoom, as on PC
center = [1200, 500]
spread = 200
step = 60

[[tap]]                   # basic attack
key = "MouseLeft"
at = [1951, 828]

[[tap]]                   # resonance skill
key = "KeyE"
at = [1781, 941]

[[tap]]                   # echo skill
key = "KeyQ"
at = [1783, 760]

[[tap]]                   # resonance liberation
key = "KeyR"
at = [1660, 850]

[[tap]]                   # interact / pick up / talk / continue dialogue
key = "KeyF"
at = [1770, 456]

[[tap]]                   # jump / climb (upper runner button)
key = "Space"
at = [2112, 751]

[[tap]]                   # dodge / sprint (lower runner button)
key = "MouseRight"
at = [2112, 931]

[[tap]]                   # dodge / sprint, the PC key too
key = "ShiftLeft"
at = [2112, 931]

[[tap]]                   # switch to character 1 (team portraits, right edge)
key = "Digit1"
at = [2150, 270]

[[tap]]                   # switch to character 2
key = "Digit2"
at = [2150, 406]

[[tap]]                   # switch to character 3
key = "Digit3"
at = [2150, 542]

[[tap]]                   # terminal (main menu)
key = "Escape"
at = [2213, 65]
pointer = true

[[tap]]                   # map (minimap)
key = "KeyM"
at = [264, 137]
pointer = true

[[tap]]                   # resonators
key = "KeyC"
at = [2102, 65]
pointer = true

[[tap]]                   # quests
key = "KeyJ"
at = [144, 257]
pointer = true

[[tap]]                   # backpack: terminal, then Backpack
key = "KeyB"
at = [2213, 65]
then = [[1744, 480]]
pointer = true

[[tap]]                   # team: terminal, then Team
key = "KeyL"
at = [2213, 65]
then = [[1264, 240]]
pointer = true

[[tap]]                   # tutorials: terminal, then Tutorials
key = "KeyH"
at = [2213, 65]
then = [[1744, 750]]
pointer = true

[[tap]]                   # mail: terminal, then the envelope in its bottom bar
key = "KeyN"
at = [2213, 65]
then = [[1648, 1026]]
pointer = true

[[tap]]                   # guide: terminal, then Guide Depot
key = "F2"
at = [2213, 65]
then = [[1986, 770]]
pointer = true

[[tap]]                   # chat
key = "Enter"
at = [154, 974]
pointer = true
