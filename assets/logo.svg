<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>Proteus</title>
  <defs>
    <!-- Worn bronze: bright where the coin was handled, dark where it sat in the ground. -->
    <radialGradient id="bronze" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f2c76e"/>
      <stop offset="0.45" stop-color="#c08a36"/>
      <stop offset="0.8" stop-color="#7a4f1d"/>
      <stop offset="1" stop-color="#3f2810"/>
    </radialGradient>
    <radialGradient id="field" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#b98234"/>
      <stop offset="1" stop-color="#5e3c15"/>
    </radialGradient>
    <linearGradient id="relief" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a1"/>
      <stop offset="1" stop-color="#d49a45"/>
    </linearGradient>
    <!-- Patina and pitting. -->
    <filter id="age" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 -2.2 1.25" result="patina"/>
      <feComposite in="patina" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="3" dy="4" result="drop"/>
      <feFlood flood-color="#2a1806" flood-opacity="0.75"/>
      <feComposite in2="drop" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- One unit of the Greek key, repeated around the rim. -->
    <path id="key" d="M-10 -232 h20 v14 h-14 v-7 h7" fill="none" stroke="#3f2810" stroke-width="3.2" stroke-linecap="square"/>
  </defs>

  <!-- Coin blank, a little out of round as struck coins are. -->
  <path d="M256 10 C392 8 504 118 502 254 C504 392 390 504 254 502 C118 503 8 390 10 256 C9 120 122 11 256 10 Z" fill="url(#bronze)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#2f1d0a" stroke-width="3" opacity="0.6"/>

  <!-- Greek key band. -->
  <g transform="translate(256 256)">
    <use xlink:href="#key" transform="rotate(0)"/><use xlink:href="#key" transform="rotate(10)"/><use xlink:href="#key" transform="rotate(20)"/><use xlink:href="#key" transform="rotate(30)"/><use xlink:href="#key" transform="rotate(40)"/><use xlink:href="#key" transform="rotate(50)"/><use xlink:href="#key" transform="rotate(60)"/><use xlink:href="#key" transform="rotate(70)"/><use xlink:href="#key" transform="rotate(80)"/><use xlink:href="#key" transform="rotate(90)"/><use xlink:href="#key" transform="rotate(100)"/><use xlink:href="#key" transform="rotate(110)"/><use xlink:href="#key" transform="rotate(120)"/><use xlink:href="#key" transform="rotate(130)"/><use xlink:href="#key" transform="rotate(140)"/><use xlink:href="#key" transform="rotate(150)"/><use xlink:href="#key" transform="rotate(160)"/><use xlink:href="#key" transform="rotate(170)"/><use xlink:href="#key" transform="rotate(180)"/><use xlink:href="#key" transform="rotate(190)"/><use xlink:href="#key" transform="rotate(200)"/><use xlink:href="#key" transform="rotate(210)"/><use xlink:href="#key" transform="rotate(220)"/><use xlink:href="#key" transform="rotate(230)"/><use xlink:href="#key" transform="rotate(240)"/><use xlink:href="#key" transform="rotate(250)"/><use xlink:href="#key" transform="rotate(260)"/><use xlink:href="#key" transform="rotate(270)"/><use xlink:href="#key" transform="rotate(280)"/><use xlink:href="#key" transform="rotate(290)"/><use xlink:href="#key" transform="rotate(300)"/><use xlink:href="#key" transform="rotate(310)"/><use xlink:href="#key" transform="rotate(320)"/><use xlink:href="#key" transform="rotate(330)"/><use xlink:href="#key" transform="rotate(340)"/><use xlink:href="#key" transform="rotate(350)"/>
  </g>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#3f2810" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#3f2810" stroke-width="2.5"/>

  <!-- Sunken field. -->
  <circle cx="256" cy="256" r="204" fill="url(#field)"/>

  <g filter="url(#emboss)" fill="url(#relief)" transform="translate(0 22)" stroke="#5a3a12" stroke-width="2" stroke-linejoin="round">
    <!-- Trident of the old man of the sea. -->
    <path d="M249 132 h14 v232 h-14 Z"/>
    <path d="M256 82 l15 40 h-8 v18 h-14 v-18 h-8 Z"/>
    <path d="M196 120 l13 34 h-7 c0 30 12 46 54 52 v14 c-52 -6 -68 -28 -68 -66 h-6 Z"/>
    <path d="M316 120 l14 34 h-6 c0 38 -16 60 -68 66 v-14 c42 -6 54 -22 54 -52 h-7 Z"/>
    <path d="M232 222 h48 v12 h-48 Z"/>
    <!-- Running waves, as on Greek friezes: the sea he rose from. -->
    <path transform="translate(136 340)" fill="none" stroke="url(#relief)" stroke-width="9" stroke-linecap="round" d="M0 44 C22 44 16 6 34 6 C44 6 48 16 44 24 C40 32 32 30 31 24 C30 18 34 14 37 18 M44 26 C44 40 46 44 48 44 M48 44 C70 44 64 6 82 6 C92 6 96 16 92 24 C88 32 80 30 79 24 C78 18 82 14 85 18 M92 26 C92 40 94 44 96 44 M96 44 C118 44 112 6 130 6 C140 6 144 16 140 24 C136 32 128 30 127 24 C126 18 130 14 133 18 M140 26 C140 40 142 44 144 44 M144 44 C166 44 160 6 178 6 C188 6 192 16 188 24 C184 32 176 30 175 24 C174 18 178 14 181 18 M188 26 C188 40 190 44 192 44 M192 44 C214 44 208 6 226 6 C236 6 240 16 236 24 C232 32 224 30 223 24 C222 18 226 14 229 18 M236 26 C236 40 238 44 240 44"/>
  </g>

  <!-- ΠΡΩΤΕΥΣ along the top of the field, as a coin's legend. -->
  <path id="legend" d="M76 256 A180 180 0 0 1 436 256" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="9" fill="#ffe3a1" stroke="#3f2810" stroke-width="0.8">
    <textPath xlink:href="#legend" startOffset="50%" text-anchor="middle">ΠΡΩΤΕΥΣ</textPath>
  </text>

  <!-- Age over everything. -->
  <path d="M256 10 C392 8 504 118 502 254 C504 392 390 504 254 502 C118 503 8 390 10 256 C9 120 122 11 256 10 Z" fill="#000" filter="url(#age)" opacity="0.55"/>
</svg>
