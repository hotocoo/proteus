[package]
name = "gfx"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Links gfxstream's host renderer, libgfxstream_backend, found through GFXSTREAM_PATH or
# pkg-config (scripts/build-gfxstream.sh builds it).
gfxstream = ["dep:rutabaga_gfx"]

[dependencies]
devices.workspace = true
rutabaga_gfx = { workspace = true, optional = true }
