[package]
name = "vmm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "proteus"
path = "src/main.rs"

[features]
# GPU acceleration through gfxstream; needs libgfxstream_backend (scripts/build-gfxstream.sh) at
# build time, through GFXSTREAM_PATH, and beside the program at run time.
gpu = ["gfx/gfxstream"]

[dependencies]
gfx.workspace = true
arch.workspace = true
devices.workspace = true
getrandom.workspace = true
hv.workspace = true
lexopt.workspace = true
libc.workspace = true
log.workspace = true
miniz_oxide.workspace = true
net.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
vm-memory.workspace = true

# The window, the sound output and host gamepads. Only hosts that have a hypervisor backend build them.
[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(any(target_os = "linux", target_os = "windows"), target_arch = "x86_64")))'.dependencies]
cpal.workspace = true
gilrs.workspace = true
rtrb.workspace = true
winit.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true

# Frames the renderer reads into memory the GPU samples as it lies (see `shared`). The same
# versions wgpu's Metal backend uses, so its textures and these are one type.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"

[dev-dependencies]
net.workspace = true
# Clicks the window's controls by their labels in tests, without a screen.
egui_kittest = { version = "0.37", default-features = false }

# A native folder and file picker for the launcher and settings. Linux uses typed paths instead,
# so it needs neither GTK nor a portal.
[target.'cfg(any(all(target_os = "macos", target_arch = "aarch64"), all(target_os = "windows", target_arch = "x86_64")))'.dependencies]
rfd.workspace = true

# AF_UNIX control sockets (std wraps them only on Unix), and the process and memory figures.
[target.'cfg(windows)'.dependencies]
uds_windows = "1.1"
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

# On Linux the window reaches the screen through X11 or Wayland, whichever is running; both are
# loaded when the program starts, so neither is needed to build it.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
winit = { workspace = true, features = ["x11", "wayland", "wayland-dlopen"] }

[build-dependencies]
embed-resource = "3"
